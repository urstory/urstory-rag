[project]
name = "urstory-rag"
version = "0.1.0"
requires-python = ">=3.12"
description = "Korean RAG Production System"
authors = [{name = "김성박", email = "urstory@fullstackfamily.com"}]
license = {text = "MIT"}
readme = {text = "", content-type = "text/markdown"}
keywords = ["rag", "korean", "nlp", "haystack", "fastapi", "elasticsearch", "nori"]

dependencies = [
    # 웹
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart>=0.0.18,<1",

    # RAG 프레임워크
    "haystack-ai>=2.27.0,<3",
    "elasticsearch-haystack>=5.0,<7",
    "pgvector-haystack>=6.3.0,<7",

    # DB
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pgvector>=0.3,<1",

    # 작업 큐
    "celery[redis]>=5.4,<6",

    # ML/NLP
    "transformers>=4.47,<5",
    "sentence-transformers>=3.3,<5",
    "torch>=2.11.0,<3",
    "accelerate>=1.13.0,<2",
    "kiwipiepy>=0.18,<1",
    "rank-bm25>=0.2,<1",

    # LLM 클라이언트
    "openai>=1.109.1,<4",
    "anthropic>=0.40,<1",
    "httpx>=0.27,<1",

    # RAGAS
    "langchain-openai>=0.3.35,<1",
    "ragas>=0.2,<1",

    # 모니터링
    "langfuse>=2.55,<4",

    # NLP
    "nltk>=3.9.1,<4",

    # 문서 변환
    "pypdf>=6.0,<7",
    "python-docx>=1.1,<2",
    "markdown-it-py>=3.0,<4",
    "mdit_plain>=1.0.1,<2",
    "docling>=2.86.0,<3",

    # 디렉토리 감시
    "watchdog>=6.0,<7",

    # 인증
    "bcrypt>=4.0,<5",
    "PyJWT>=2.12.1,<3",
    "email-validator>=2.0,<3",

    # Rate Limiting
    "slowapi>=0.1.9,<1",

    # 로깅
    "structlog>=24.1.0,<25",

    # 에러 추적
    "sentry-sdk[fastapi]>=2.0.0,<3",

    # 유틸리티
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/urstory/urstory-rag"
Repository = "https://github.com/urstory/urstory-rag"
Issues = "https://github.com/urstory/urstory-rag/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "performance: 성능 테스트 (별도 실행: pytest -m performance)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    # Generated / environment-coupled modules with no meaningful branches
    "app/__init__.py",
    "app/main.py",
    "app/worker.py",
    # Alembic migrations are not unit-test targets
    "alembic/*",
]

[tool.coverage.report]
# Unit test suite measured at 78% (see PR #15). Floor set just below current
# to prevent regressions; aspirational target is 85%.
# CI failure threshold: fail_under.
fail_under = 75
skip_covered = false
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
